spring:
  mail:
    from: "library@grakovne.org"
    subject: "Kindle Sideload Book"
    text: "Your Books are ready!"
    host: "smtp.mail.me.com"
    port: "587"
    username: "grakovne"
    password: ""
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          port: 587
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    platform: postgres
    url: jdbc:postgresql://localhost:5432/kindle_sideload
    username: kindle_sideload
    password: kindle_sideload
    driverClassName: org.postgresql.Driver

  flyway:
    enabled: true

  jooq:
    sql-dialect: POSTGRES

  # All @Scheduled workers (the 100ms conversion queue, the STK and TTL workers, the hourly
  # converter-binary update) share this pool. More than one thread so a single slow worker can
  # never starve the others; the binary-update task used to hang the only scheduler thread.
  task:
    scheduling:
      pool:
        size: 4

# Bounds every outbound HTTP call (GitHub release checks, Telegram file downloads) so a stalled
# connection fails fast instead of parking a scheduler thread forever. read-timeout is a
# per-read inactivity timeout, so large book downloads that stream steadily are not cut off.
http:
  client:
    connect-timeout: 5s
    read-timeout: 60s

telegram:
  token: ""
  level: WARN
  deduplicateMessages: true
  interactiveMessageEditing: false

ads:
  blockDelimiter: "\n\n_____\n\n"
  creatives:

user:
  converter:
    configuration:
      path: "user_configurations"
      file-name: "configuration.zip"
  environment:
    temporaryFolder: "user_environments"

file:
  upload:
    max-size: 20000000

converter:
  source:
    releasesUrl: "https://api.github.com/repos/rupor-github/fb2cng/releases/latest"
  binary:
    binaryPersistencePath: "fb2_converter"
    converterFileName: "fbc"
    shell: "/bin/bash"
    shellArgs: "-c"
    configurationExtensions: [ "toml", "yaml", "json" ]
    converterParameters: ""
  sourceFileExtensions: [ "fb2", "fb2.zip" ]

environment:
  temporaryFolder: "temporary_user_environments"
  outputFileExtensions: ["epub", "azw8"]
  ttlInSeconds: 86400

logging:
  level:
    root: INFO
    org.grakovne: DEBUG

shelf:
  web:
    host-name: "http://192.168.1.12:8080/"

admin:
  token: "CHANGE_ME_metrics_admin_token"